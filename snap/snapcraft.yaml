name: level-zero-tests
base: core26
confinement: strict
lint:
  ignore:
    - metadata
platforms:
  amd64:
    build-on: [amd64]
version: '1.16.1'
summary: Intel Level Zero Unit Tests
license: MIT

description: |
  Snap for building and running Intel's Level Zero unit tests
  from the Level Zero repository

apps:
  test:
    command: test
    plugs:
      - opengl
      - hardware-observe
      - system-observe
      - shared-memory
      - network-bind
  list-tests:
    command: list_tests
    plugs:
      - opengl
      - hardware-observe
      - system-observe
      - shared-memory
      - network-bind

plugs:
  # test_debug uses POSIX shm under /dev/shm for debugger/debuggee sync.
  # private:true auto-connects to the implicit core slot for private /dev/shm.
  shared-memory:
    private: true

parts:
  test-runner:
    source: bin/
    plugin: dump
    stage:
      - test

  list-tests-runner:
    source: bin/
    plugin: dump
    stage:
      - list_tests

  level-zero-tests:
    plugin: nil
    source: https://github.com/oneapi-src/level-zero-tests.git
    source-type: git
    source-commit: 87cf732fcfb31a943082fb3ca7c17b729eaf4758
    build-attributes:
      - enable-patchelf
    build-packages:
      - build-essential
      - binutils
      - cmake
      - git
      - pkg-config
      - ninja-build
      - clang
      - ocl-icd-opencl-dev
      - libvulkan-dev
      - libgl1-mesa-dev
      - libglfw3-dev
      - libgles2-mesa-dev
      - glslang-tools
      - libboost1.83-dev
      - libboost-log1.83-dev
      - libboost-program-options1.83-dev
      - libboost-timer1.83-dev
      - libboost-chrono1.83-dev
      - libboost-serialization1.83-dev
      - libboost-filesystem1.83-dev
      - libboost-system1.83-dev
      - libdrm-dev
      - libudev-dev
      - libze-dev
      - libssl-dev
      - libgtest-dev
      - libpng-dev
      - python3
    stage-packages:
      - cmake
      - libdrm2
      - libudev1
      - libpci3
      - pciutils
      - libigc2
      - libigdfcl2
      - libnl-3-200
      - libnl-route-3-200
      - libze-intel-gpu1
      - libze1
      - libssl3t64
      - libpng16-16t64
      - libboost-log1.83.0
      - libboost-program-options1.83.0
      - libboost-timer1.83.0
      - libboost-filesystem1.83.0
      - libboost-chrono1.83.0
      - libboost-serialization1.83.0
      - libboost-system1.83.0
      - libstdc++6
    override-build: |
      set -eux

      mkdir -p build
      cd build
      cmake \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_INSTALL_PREFIX="${CRAFT_PART_INSTALL}/usr" \
        ..
      cmake --build . -j"$(nproc)" --config Release --target install
      cd ..

      mkdir -p "${CRAFT_PART_INSTALL}/level-zero-tests"
      cp -a . "${CRAFT_PART_INSTALL}/level-zero-tests/src"

      # Stage the full build tree so ctest metadata and unit-test binaries
      # are available at runtime.
      mkdir -p "${CRAFT_PART_INSTALL}/usr/lib/level-zero-tests"
      cp -a build "${CRAFT_PART_INSTALL}/usr/lib/level-zero-tests/build"

      # Make unit-test binaries easy to discover from $PATH.
      mkdir -p "${CRAFT_PART_INSTALL}/usr/bin"
      find build -type f -name "*test*" -perm -111 -exec cp -a {} "${CRAFT_PART_INSTALL}/usr/bin/" \;
      # Several tests spawn helper binaries via a "<cwd>/<subdir>/helper"
      # relative path. Physically copy (not symlink) each helper subdir into
      # usr/bin/: AppArmor only grants library-read access to real paths
      # under usr/bin/**, so a symlink pointing outside it loses access.
      for d in device ipc tracing fabric memory process sysman_device debug metrics; do
        if [ -d "${CRAFT_PART_INSTALL}/usr/${d}" ]; then
          mkdir -p "${CRAFT_PART_INSTALL}/usr/bin/${d}"
          cp -a "${CRAFT_PART_INSTALL}/usr/${d}/." "${CRAFT_PART_INSTALL}/usr/bin/${d}/"
        fi
      done
      # Some tests load SPIR-V modules from the current working directory.
      find . -type f -name "*.spv" -exec cp -a {} "${CRAFT_PART_INSTALL}/usr/bin/" \;
